<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Henry Infiltrating the Airship</title>
  <style>
    html, body, #container { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    ruffle-player { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
  <script>
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("container").appendChild(player);
      player.load("infiltratingtheairship.swf");
    });
  </script>
</body>
</html>
