<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 Henry Infiltrating the Airship</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #container { position: fixed; inset: 0; }
    #container ruffle-player { width: 100%; height: 100%; display: block; }
    #log { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(0,0,0,.75); color: #0f0; font: 12px monospace; padding: 6px 10px; white-space: pre-wrap; pointer-events: none; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="log">Page loaded.</div>

  <script>
    function log(m) { document.getElementById("log").textContent += "\n" + m; }
    window.addEventListener("error", function (e) { log("JS ERROR: " + e.message); });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"
          onerror="log('FAILED to load Ruffle from CDN (blocked network or ad blocker?)')"></script>

  <script>
    var SWF = "infiltratingtheairship.swf";

    window.addEventListener("load", function () {
      log("Protocol: " + location.protocol);
      log("Ruffle present: " + !!window.RufflePlayer);

      fetch(SWF).then(function (r) {
        log("SWF fetch: HTTP " + r.status + ", type: " + r.headers.get("content-type"));
        return r.arrayBuffer();
      }).then(function (buf) {
        var b = new Uint8Array(buf);
        var sig = String.fromCharCode(b[0], b[1], b[2]);
        log("SWF size: " + buf.byteLength + " bytes, header: " + sig + " (should be FWS, CWS or ZWS)");
      }).catch(function (e) {
        log("SWF fetch FAILED: " + e);
      });

      if (!window.RufflePlayer) return;
      var player = window.RufflePlayer.newest().createPlayer();
      document.getElementById("container").appendChild(player);
      player.addEventListener("loadedmetadata", function () { log("Ruffle: game metadata loaded OK"); });
      player.load(SWF).then(function () { log("Ruffle: load started"); })
                      .catch(function (e) { log("Ruffle load ERROR: " + e); });
    });
  </script>
</body>
</html>
