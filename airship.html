<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 Henry Infiltrating the Airship</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    embed, ruffle-embed { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <script>
    var sources = [
      "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle",
      "ruffle/ruffle.js"
    ];
    function addEmbed() {
      var e = document.createElement("embed");
      e.src = "infiltratingtheairship.swf";
      document.body.appendChild(e);
    }
    function load(i) {
      if (i >= sources.length) { document.body.textContent = "Could not load Ruffle."; return; }
      var s = document.createElement("script");
      s.src = sources[i];
      s.onload = addEmbed;
      s.onerror = function () { load(i + 1); };
      document.head.appendChild(s);
    }
    load(0);
  </script>
</body>
</html>
