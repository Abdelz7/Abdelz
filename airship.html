<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4 Henry Infiltrating the Airship</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #container { position: fixed; inset: 0; }
    #container ruffle-player { width: 100%; height: 100%; display: block; }
    #log { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: rgba(0,0,0,.75); color: #0f0; font: 12px monospace; padding: 6px 10px; white-space: pre-wrap; pointer-events: none; }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="log">Page loaded.</div>

  <script>
    var SWF = "infiltratingtheairship.swf";
    var SOURCES = [
      "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle",
      "https://unpkg.com/@ruffle-rs/ruffle",
      "ruffle/ruffle.js"
    ];

    function log(m) { document.getElementById("log").textContent += "\n" + m; }
    window.addEventListener("error", function (e) { log("JS ERROR: " + e.message); });

    function loadRuffle(i, done) {
      if (i >= SOURCES.length) { done(false); return; }
      var s = document.createElement("script");
      s.src = SOURCES[i];
      s.onload = function () {
        if (window.RufflePlayer) { log("Ruffle loaded from: " + SOURCES[i]); done(true); }
        else { log("Loaded but no RufflePlayer: " + SOURCES[i]); loadRuffle(i + 1, done); }
      };
      s.onerror = function () { log("Failed: " + SOURCES[i]); loadRuffle(i + 1, done); };
      document.head.appendChild(s);
    }

    function startGame() {
      var player = window.RufflePlayer.newest().createPlayer();
      document.getElementById("container").appendChild(player);
      player.addEventListener("loadedmetadata", function () { log("Game loaded OK. Click the game if it asks."); });
      player.load({ url: SWF, autoplay: "on", unmuteOverlay: "visible" })
        .then(function () { log("Ruffle: load started"); })
        .catch(function (e) { log("Ruffle load ERROR: " + e); });
    }

    window.addEventListener("load", function () {
      log("Protocol: " + location.protocol);

      fetch(SWF).then(function (r) {
        log("SWF fetch: HTTP " + r.status);
        return r.arrayBuffer();
      }).then(function (buf) {
        var b = new Uint8Array(buf);
        var sig = String.fromCharCode(b[0], b[1], b[2]);
        log("SWF size: " + buf.byteLength + " bytes, header: " + sig + (/^(FWS|CWS|ZWS)$/.test(sig) ? " (valid)" : " (NOT a valid SWF)"));
      }).catch(function (e) { log("SWF fetch FAILED: " + e); });

      loadRuffle(0, function (ok) {
        if (ok) startGame();
        else log("Could not load Ruffle from any source. Download the self-hosted build from ruffle.rs into a 'ruffle' folder.");
      });
    });
  </script>
</body>
</html>
