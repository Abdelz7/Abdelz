<!DOCTYPE html>
<html>
<head>
    <title>Abdelz7</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e5631; /* Football field green */
            font-family: Arial, sans-serif;
            color: white;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">TOUCHDOWN CHALLENGE | SCORE: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas to fill the screen completely
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        
        // Player properties (The Quarterback/Runner)
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            size: 20,
            speed: 8
        };

        // Defenders rushing down the field
        const defenders = [];
        function spawnDefender() {
            defenders.push({
                x: Math.random() * canvas.width,
                y: -30,
                width: 25,
                height: 25,
                speed: 4 + Math.random() * 4
            });
        }
        setInterval(spawnDefender, 600);

        // Control tracking
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Touch/Mouse controls for easy playing
        window.addEventListener('mousemove', e => {
            player.x = e.clientX;
        });
        window.addEventListener('touchmove', e => {
            if(e.touches.length > 0) {
                player.x = e.touches[0].clientX;
            }
        });

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw football field yard lines
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 5;
            for(let i = 0; i < canvas.height; i += 80) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Move player with arrow keys or A/D
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
            
            // Keep player on screen
            if (player.x < player.size) player.x = player.size;
            if (player.x > canvas.width - player.size) player.x = canvas.width - player.size;

            // Draw Player (Offense - Blue)
            ctx.fillStyle = '#0055ff';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw Football in player's hands
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.ellipse(player.x, player.y + 5, 8, 12, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();

            // Update and draw defenders (Defense - Red)
            for(let i = defenders.length - 1; i >= 0; i--) {
                const def = defenders[i];
                def.y += def.speed;

                ctx.fillStyle = '#ff3333';
                ctx.fillRect(def.x - def.width/2, def.y - def.height/2, def.width, def.height);

                // Check for tackle (collision)
                const distX = Math.abs(player.x - def.x);
                const distY = Math.abs(player.y - def.y);
                if (distX < (player.size + def.width/2) && distY < (player.size + def.height/2)) {
                    // Tacked! Reset score
                    score = 0;
                    document.getElementById('score').innerText = score;
                    defenders.length = 0; // Clear field
                    break;
                }

                // If defender passes the bottom, you gain yards/score
                if (def.y > canvas.height) {
                    defenders.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = score;
                }
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
