<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unblocked Games Hub Template</title>
    <style>
        /* Modern dark theme dashboard palette styling */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f0f12; color: #f0f0f5; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        /* Top Header Navbar */
        header { background-color: #16161a; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232329; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .nav-links button { background: none; border: none; color: #94a3b8; font-size: 1rem; font-weight: 500; cursor: pointer; margin-left: 20px; transition: color 0.2s; }
        .nav-links button:hover { color: #38bdf8; }

        /* Main Container for the Game Discovery Grid */
        main { max-width: 1300px; width: 100%; margin: 0 auto; padding: 40px 20px; flex-grow: 1; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 25px; color: #ffffff; border-left: 4px solid #38bdf8; padding-left: 12px; }

        /* Responsive Dashboard Grid */
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }

        /* Interactive Game Selection Tiles */
        .game-card { background-color: #16161a; border: 1px solid #232329; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; aspect-ratio: 1 / 1; }
        .game-card:hover { transform: translateY(-5px); border-color: #38bdf8; box-shadow: 0 10px 20px rgba(56, 189, 248, 0.1); }
        
        .game-thumbnail { flex-grow: 1; background-color: #1e1e24; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; height: 100%; overflow: hidden; }
        .game-thumbnail img { width: 100%; height: 100%; object-fit: cover; }

        .game-info { padding: 12px; background-color: #16161a; text-align: center; }
        .game-title { font-size: 0.95rem; font-weight: 600; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Fullscreen Theater/Player Interface Layer */
        #player-view { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000000; z-index: 1000; flex-direction: column; }
        .player-bar { background-color: #16161a; padding: 10px 25px; display: flex; justify-content: space-between; align-items: center; height: 60px; border-bottom: 1px solid #232329; }
        .player-game-title { font-weight: 700; font-size: 1.1rem; }
        .player-controls { display: flex; gap: 10px; }
        .player-controls button { background-color: #232329; color: #ffffff; border: 1px solid #3f3f46; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: all 0.2s; }
        .player-controls button.close-btn { background-color: #ef4444; border-color: #ef4444; }
        .player-controls button:hover { opacity: 0.9; transform: scale(1.02); }
        .iframe-wrapper { flex-grow: 1; position: relative; width: 100%; height: calc(100vh - 60px); }
        #game-frame { width: 100%; height: 100%; border: none; background-color: #000; }
    </style>
</head>
