<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glock 19 & Weapon Shop Platformer</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        #controls {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="controls">
        <strong>Controls:</strong> A / D or Left/Right Arrow = Move | W, Space, or Up Arrow = Jump | Left Click = Fire Target | R = Return to Menu / Respawn
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game States: "MENU", "SHOP", "PLAYING"
let gameState = "MENU";

// Global Ecosystem Metrics
const GRAVITY = 0.5;
let score = 0;
let coins = 100; // Starting wallet balance

// Input management
const keys = {};
let mouse = { x: 0, y: 0 };

// Weapon Inventory Registry 
const WEAPONS = {
    glock: { name: "Glock 19", damage: 25, fireInterval: 10, bulletSpeed: 20, cost: 0, purchased: true, color: "#333", bulletColor: "#ffcc00", barrelLen: 14, bWidth: 6 },
    revolver: { name: "Revolver", damage: 52, fireInterval: 25, bulletSpeed: 16, cost: 200, purchased: false, color: "#888", bulletColor: "#ffaa00", barrelLen: 18, bWidth: 8 },
    deagle: { name: "Desert Eagle", damage: 75, fireInterval: 40, bulletSpeed: 24, cost: 500, purchased: false, color: "#aaa", bulletColor: "#ff3300", barrelLen: 22, bWidth: 10 }
};
let currentWeaponKey = "glock";

// Player Profile Object
let player = {
    x: 100,
    y: 300,
    width: 24,
    height: 36,
    vx: 0,
    vy: 0,
    speed: 5,
    jumpForce: 11,
    grounded: false,
    lastShotFrame: 0
};

// Global Tracking Pools
let platforms = [];
let targets = [];
let bullets = [];
let particles = [];
let frameCount = 0;

// Shop Interactive Click Grid Positions
const shopItems = [
    { key: "glock", x: 150, y: 220, w: 140, h: 120 },
    { key: "revolver", x: 330, y: 220, w: 140, h: 120 },
    { key: "deagle", x: 510, y: 220, w: 140, h: 120 }
];

// Initialize Game Session Setup
function initGame() {
    score = 0;
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    bullets = [];
    particles = [];
    
    // Level Map Terrain Design layout
    platforms = [
        { x: 0, y: 460, w: 800, h: 40 },
        { x: 150, y: 350, w: 180, h: 15 },
        { x: 450, y: 350, w: 180, h: 15 },
        { x: 300, y: 240, w: 200, h: 15 },
        { x: 80, y: 150, w: 140, h: 15 },
        { x: 580, y: 150, w: 140, h: 15 }
    ];
    
    targets = [];
    for (let i = 0; i < 4; i++) {
        spawnTarget();
    }
}

function spawnTarget() {
    let sideChoice = Math.random() > 0.5;
    targets.push({
        x: sideChoice ? Math.random() * 200 + 50 : Math.random() * 200 + 550,
        y: Math.random() * 250 + 50,
        r: 16,
        hp: 100,
        maxHp: 100,
        vx: (Math.random() - 0.5) * 2.5,
        vy: (Math.random() - 0.5) * 1.5
    });
}

function createSparks(x, y, color) {
    for (let i = 0; i < 8; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 20,
            color: color
        });
    }
}

// Input Listener Hooks
window.addEventListener("keydown", e => { 
    keys[e.key.toLowerCase()] = true; 
    if (e.key.toLowerCase() === 'r') {
        gameState = "MENU";
    }
});
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener("mousemove", e => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", e => {
    if (e.button !== 0) return; // Only track left click
    
    if (gameState === "MENU") {
        if (mouse.x > 250 && mouse.x < 550 && mouse.y > 220 && mouse.y < 280) {
            initGame();
            gameState = "PLAYING";
        } else if (mouse.x > 250 && mouse.x < 550 && mouse.y > 310 && mouse.y < 370) {
            gameState = "SHOP";
        }
    } 
    else if (gameState === "SHOP") {
        // Back Button Hit Detection Box
        if (mouse.x > 30 && mouse.x < 130 && mouse.y > 30 && mouse.y < 70) {
            gameState = "MENU";
            return;
        }
        // Shop Grid Selection Analysis Loop
        shopItems.forEach(item => {
            if (mouse.x > item.x && mouse.x < item.x + item.w && mouse.y > item.y && mouse.y < item.y + item.h) {
                let wp = WEAPONS[item.key];
                if (!wp.purchased && coins >= wp.cost) {
                    coins -= wp.cost;
                    wp.purchased = true;
                    currentWeaponKey = item.key;
                } else if (wp.purchased) {
                    currentWeaponKey = item.key;
                }
            }
        });
    } 
    else if (gameState === "PLAYING") {
        fireActiveWeapon();
    }
});

function fireActiveWeapon() {
    let wp = WEAPONS[currentWeaponKey];
    if (frameCount - player.lastShotFrame < wp.fireInterval) return;
    
    player.lastShotFrame = frameCount;
    
    let pCenterX = player.x + player.width / 2;
    let pCenterY = player.y + player.height / 2;
    let angle = Math.atan2(mouse.y - pCenterY, mouse.x - pCenterX);
    
    bullets.push({
        x: pCenterX + Math.cos(angle) * wp.barrelLen,
        y: pCenterY + Math.sin(angle) * wp.barrelLen,
        vx: Math.cos(angle) * wp.bulletSpeed,
        vy: Math.sin(angle) * wp.bulletSpeed,
        damage: wp.damage,
        color: wp.bulletColor,
        size: wp.bWidth
    });
}

// Logic Frame Processing Functions
function update() {
    frameCount++;
    if (gameState !== "PLAYING") return;

    // Horizonal Acceleration Processing
    if (keys['a'] || keys['arrowleft']) player.vx = -player.speed;
    else if (keys['d'] || keys['arrowright']) player.vx = player.speed;
    else player.vx = 0;

    // Vertical Velocity Jump Calculations
    if ((keys['w'] || keys[' '] || keys['arrowup']) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    // Apply Environmental Physics Constants
    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    // Window Containment Traps
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // Platform Boundary Rigid Body Evaluations
    player.grounded = false;
    platforms.forEach(p => {
        if (player.x + player.width > p.x && player.x < p.x + p.w) {
            if (player.y + player.height >= p.y && player.y + player.height - player.vy <= p.y + 6) {
                player.y = p.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
        }
    });

    // Bullet Trajectory Calculation & Target Collision Loop
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        
        let outOfBounds = b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height;
        let hitRegistered = false;
        
        for (let j = targets.length - 1; j >= 0; j--) {
            let t = targets[j];
            let dist = Math.hypot(b.x - t.x, b.y - t.y);
            if (dist < t.r + b.size / 2) {
                t.hp -= b.damage;
                createSparks(b.x, b.y, b.color);
                hitRegistered = true;
                
                if (t.hp <= 0) {
                    createSparks(t.x, t.y, "#ff3333");
                    coins += 25;
                    score += 100;
                    targets.splice(j, 1);
                    spawnTarget();
                }
                break;
            }
        }
        
        if (outOfBounds || hitRegistered) {
            bullets.splice(i, 1);
        }
    }

    // Floating Target Floating Drift Update
    targets.forEach(t => {
        t.x += t.vx;
        t.y += t.vy;
        if (t.x - t.r < 0 || t.x + t.r > canvas.width) t.vx *= -1;
        if (t.y - t.r < 0 || t.y + t.r > 380) t.vy *= -1;
    });

    // Disperse Dynamic Particles Lifecycle Fade
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Graphic Painting Pipeline System
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "MENU") {
        ctx.fillStyle = "#fff";
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GLOCK & ARMORY PLATFORMER", 400, 140);
        
        // Start Canvas Control Block Area
        ctx.fillStyle = "#28a745";
        ctx.fillRect(250, 220, 300, 60);
        ctx.fillStyle = "#fff";
        ctx.font = "20px sans-serif";
        ctx.fillText("START CHALLENGE", 400, 255);
        
        // Shop Controller Selection Box Canvas Interface 
        ctx.fillStyle = "#007bff";
        ctx.fillRect(250, 310, 300, 60);
        ctx.fillStyle = "#fff";
        ctx.fillText("WEAPON STORE", 400, 345);

        ctx.fillStyle = "#aaa";
        ctx.font = "14px sans-serif";
