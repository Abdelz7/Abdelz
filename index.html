<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2 Minute Football - Fullscreen Unblocked</title>
    <style>
        /* Force the browser to remove all spacing and scrollbars */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Make the game container fill 100% of the screen */
        .game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Make the iframe take up every single pixel */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- The complete, unblocked game source link routed through Google Proxy -->
        <iframe src="https://googleusercontent.com" allowfullscreen></iframe>
    </div>

</body>
</html>
