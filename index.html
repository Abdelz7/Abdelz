<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">🎮 Unblocked Hub</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search games...">
        </div>
    </header>

    <main class="container">
        <section id="gameGrid" class="game-grid">
            <!-- Games populate dynamically from script.js -->
        </section>
    </main>

    <!-- Modal for playing games -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="iframe-container">
                <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
