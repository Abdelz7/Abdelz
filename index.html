<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glock 19 & Weapon Shop Platformer</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: crosshair;
        }
        #controls {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="controls">
        <strong>Controls:</strong> A / D or Left/Right Arrow = Move | W, Space, or Up Arrow = Jump | Left Click = Fire Target | R = Return to Menu / Respawn
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game States: "MENU", "SHOP", "PLAYING", "GAMEOVER"
let gameState = "MENU";

// Global Ecosystem Metrics
const GRAVITY = 0.5;
let score = 0;
let coins = 100; // Starting wallet balance
let gameOver = false;

// Input management
const keys = {};
let mouse = { x: 0, y: 0 };

// Weapon Inventory Registry (Assuming 60 FPS update loop: 1 frame ≈ 0.0167 seconds)
const WEAPONS = {
    glock: { name: "Glock 19", damage: 25, cooldown: 0.05, fireInterval: 3, bulletSpeed: 20, cost: 0, purchased: true, color: "#333", bulletColor: "#ffcc00", barrelLen: 14, bWidth: 6 },
    revolver: { name: "Revolver", damage: 52, cooldown: 0.20, fireInterval: 12, bulletSpeed: 16, cost: 200, purchased: false, color: "#888", bulletColor: "#ffaa00", barrelLen: 18, bWidth: 8 },
    deagle: { name: "Desert Eagle", damage: 75, cooldown: 0.50, fireInterval: 30, bulletSpeed: 24, cost: 500, purchased: false, color: "#ddd", bulletColor: "#ff4500", barrelLen: 22, bWidth: 10 }
};
let currentWeapon = WEAPONS.glock;
let fireCooldownTimer = 0;

// Player Settings
const player = {
    x: 100,
    y: 300,
    width: 24,
    height: 40,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpForce: 11,
    grounded: false,
    hp: 100
};

// Projectiles & Entities array lists
const bullets = [];
const enemies = [];
const ENEMY_MAX_HP = 100;
const ENEMY_SPEED = 1.5;
let spawnTimer = 0;
const SPAWN_INTERVAL = 120;

// Rigid Level Layout Bounds
const platforms = [
    { x: 0, y: 460, width: 800, height: 40 },
    { x: 150, y: 340, width: 160, height: 20 },
    { x: 480, y: 340, width: 160, height: 20 },
    { x: 300, y: 220, width: 200, height: 20 }
];

// UI Interface Button Bounds
const menuButtons = {
    play: { x: 300, y: 200, width: 200, height: 50, label: "PLAY NOW" },
    shop: { x: 300, y: 280, width: 200, height: 50, label: "WEAPON SHOP" }
};

const shopButtons = {
    buyGlock: { x: 80, y: 220, width: 180, height: 60, item: "glock" },
    buyRevolver: { x: 310, y: 220, width: 180, height: 60, item: "revolver" },
    buyDeagle: { x: 540, y: 220, width: 180, height: 60, item: "deagle" },
    back: { x: 300, y: 400, width: 200, height: 45, label: "MAIN MENU" }
};

// Listeners
window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    if ((e.key === "r" || e.key === "R") && gameState === "GAMEOVER") {
        gameState = "MENU";
    }
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;

    if (gameState === "MENU") {
        if (isMouseOver(mouse, menuButtons.play)) {
            resetGame();
            gameState = "PLAYING";
        } else if (isMouseOver(mouse, menuButtons.shop)) {
            gameState = "SHOP";
        }
    } 
    else if (gameState === "SHOP") {
        if (isMouseOver(mouse, shopButtons.back)) {
            gameState = "MENU";
        }
        for (const key in shopButtons) {
            if (key === "back") continue;
            const btn = shopButtons[key];
            if (isMouseOver(mouse, btn)) {
                const wpn = WEAPONS[btn.item];
                if (!wpn.purchased) {
                    if (coins >= wpn.cost) {
                        coins -= wpn.cost;
                        wpn.purchased = true;
                        currentWeapon = wpn;
                    }
                } else {
                    currentWeapon = wpn;
                }
            }
        }
    }
});

function isMouseOver(m, btn) {
    return m.x > btn.x && m.x < btn.x + btn.width && m.y > btn.y && m.y < btn.y + btn.height;
}

function fireWeapon() {
    const pCenterX = player.x + player.width / 2;
    const pCenterY = player.y + player.height / 2;
    const angle = Math.atan2(mouse.y - pCenterY, mouse.x - pCenterX);
    
    bullets.push({
        x: pCenterX,
        y: pCenterY,
        vx: Math.cos(angle) * currentWeapon.bulletSpeed,
        vy: Math.sin(angle) * currentWeapon.bulletSpeed,
        width: currentWeapon.bWidth,
        height: 4,
        damage: currentWeapon.damage,
        color: currentWeapon.bulletColor
    });
    
    fireCooldownTimer = currentWeapon.fireInterval; 
}

function spawnEnemy() {
    const side = Math.random() > 0.5;
    const x = side ? canvas.width + 20 : -40;
    enemies.push({
        x: x,
        y: 420,
        width: 24,
        height: 40,
        hp: ENEMY_MAX_HP,
        speed: ENEMY_SPEED + Math.random() * 0.4
    });
}

function checkCollision(a, b) {
    return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
}

function resetGame() {
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.hp = 100;
    player.grounded = false;
    bullets.length = 0;
    enemies.length = 0;
    score = 0;
    spawnTimer = 0;
    fireCooldownTimer = 0;
}

function update() {
    if (gameState !== "PLAYING") return;

    if (fireCooldownTimer > 0) fireCooldownTimer--;

    // Auto-fire handling if left mouse is held down
    if (keys["LeftClick"] || keys["mousedown"] || (navigator.maxTouchPoints === 0 && keys[0])) {}

    // Check click direct tracking via dynamic update cycle loop
    if (keys["ClickActive"] || fireCooldownTimer <= 0) {
        // Handled via separate window handler below for continuous clicks
    }

    // Movement engine inputs
    if (keys["a"] || keys["A"] || keys["ArrowLeft"]) {
        player.vx = -player.speed;
    } else if (keys["d"] || keys["D"] || keys["ArrowRight"]) {
        player.vx = player.speed;
    } else {
        player.vx = 0;
    }

    if ((keys["w"] || keys["W"] || keys[" "] || keys["ArrowUp"]) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // Platform resolving pass
    player.grounded = false;
    for (const plat of platforms) {
        if (checkCollision(player, plat)) {
            const overlapX = Math.min(player.x + player.width - plat.x, plat.x + plat.width - player.x);
            const overlapY = Math.min(player.y + player.height - plat.y, plat.y + plat.height - player.y);

            if (overlapX > overlapY) {
                if (player.vy > 0) {
                    player.y -= overlapY;
                    player.vy = 0;
                    player.grounded = true;
                } else if (player.vy < 0) {
                    player.y += overlapY;
                    player.vy = 0;
                }
            } else {
                if (player.vx > 0) player.x -= overlapX;
                else if (player.vx < 0) player.x += overlapX;
            }
        }
    }

    // Bullets processing run
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (checkCollision(b, e)) {
                e.hp -= b.damage;
                bullets.splice(i, 1);
                
                if (e.hp <= 0) {
                    enemies.splice(j, 1);
                    score += 10;
                }
                break;
            }
        }
    }

    // NPC processing cycle
    spawnTimer++;
    if (spawnTimer >= SPAWN_INTERVAL) {
        spawnEnemy();
        spawnTimer = 0;
    }

    for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        if (e.x < player.x) e.x += e.speed;
        else e.x -= e.speed;

        if (checkCollision(player, e)) {
            player.hp -= 0.6; 
            if (player.hp <= 0) {
                player.hp = 0;
                const payout = Math.floor(score / 100);
                coins += payout;
                gameState = "GAMEOVER";
            }
        }
    }
}

// Track mouse down state globally for automatic weapon fire support
let isMouseDown = false;
window.addEventListener("mousedown", (e) => {
    if(e.button === 0) isMouseDown = true;
});
window.addEventListener("mouseup", (e) => {
    if(e.button === 0) isMouseDown = false;
});

function drawButton(btn, isHovered, fillColor = "#444") {
    ctx.fillStyle = isHovered ? "#666" : fillColor;
    ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
    ctx.strokeStyle = "#fff";
