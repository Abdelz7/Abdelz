<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glock 19 Platformer</title>
    <style>
        body {
            margin: 0;
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background: #222;
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #controls {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            color: #aaa;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="controls">
        <strong>Controls:</strong> A / D or Left/Right Arrow = Move | W, Space, or Up Arrow = Jump | Left Click = Fire Glock 19 (25 Damage)
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game Constants & State
const GRAVITY = 0.5;
let score = 0;
let gameOver = false;

// Input tracking
const keys = {};
let mouse = { x: 0, y: 0 };

// Player Object
const player = {
    x: 100,
    y: 300,
    width: 24,
    height: 40,
    vx: 0,
    vy: 0,
    speed: 4,
    jumpForce: 11,
    grounded: false,
    facingRight: true,
    hp: 100
};

// Weapons Systems
const bullets = [];
const BULLET_SPEED = 12;
const GLOCK_DAMAGE = 25;

// NPC Settings
const enemies = [];
const ENEMY_MAX_HP = 100;
const ENEMY_SPEED = 1.5;
let spawnTimer = 0;
const SPAWN_INTERVAL = 120; // Frames between spawns (~2 seconds)

// Level Design (Platforms)
const platforms = [
    { x: 0, y: 460, width: 800, height: 40 },   // Ground
    { x: 150, y: 340, width: 160, height: 20 },  // Mid Left
    { x: 480, y: 340, width: 160, height: 20 },  // Mid Right
    { x: 300, y: 220, width: 200, height: 20 }   // Top Center
];

// Event Listeners
window.addEventListener("keydown", (e) => { keys[e.code] = true; });
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
});

canvas.addEventListener("mousedown", (e) => {
    if (e.button === 0 && !gameOver) {
        fireBullet();
    } else if (gameOver) {
        resetGame();
    }
});

function fireBullet() {
    const pCenterX = player.x + player.width / 2;
    const pCenterY = player.y + player.height / 2;
    const angle = Math.atan2(mouse.y - pCenterY, mouse.x - pCenterX);

    bullets.push({
        x: pCenterX,
        y: pCenterY,
        vx: Math.cos(angle) * BULLET_SPEED,
        vy: Math.sin(angle) * BULLET_SPEED,
        radius: 4
    });
}

function spawnEnemy() {
    const edge = Math.random() < 0.5 ? 0 : canvas.width - 24;
    enemies.push({
        x: edge,
        y: 420, 
        width: 24,
        height: 40,
        hp: ENEMY_MAX_HP,
        vx: edge === 0 ? ENEMY_SPEED : -ENEMY_SPEED
    });
}

function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

function resetGame() {
    player.x = 100;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.hp = 100;
    bullets.length = 0;
    enemies.length = 0;
    score = 0;
    spawnTimer = 0;
    gameOver = false;
}

function update() {
    if (gameOver) return;

    // Player Movement Horizontal
    if (keys["KeyA"] || keys["ArrowLeft"]) {
        player.vx = -player.speed;
        player.facingRight = false;
    } else if (keys["KeyD"] || keys["ArrowRight"]) {
        player.vx = player.speed;
        player.facingRight = true;
    } else {
        player.vx = 0;
    }

    // Player Movement Vertical (Jump)
    if ((keys["KeyW"] || keys["Space"] || keys["ArrowUp"]) && player.grounded) {
        player.vy = -player.jumpForce;
        player.grounded = false;
    }

    // Apply Gravity
    player.vy += GRAVITY;

    player.x += player.vx;
    player.y += player.vy;

    player.grounded = false;

    // Platform Collisions
    for (let plat of platforms) {
        if (player.x + player.width > plat.x && player.x < plat.x + plat.width) {
            if (player.y + player.height >= plat.y && player.y + player.height - player.vy <= plat.y) {
                player.y = plat.y - player.height;
                player.vy = 0;
                player.grounded = true;
            }
            else if (player.y <= plat.y + plat.height && player.y - player.vy >= plat.y + plat.height) {
                player.y = plat.y + plat.height;
                player.vy = 0;
            }
        }
    }

    // Screen bounds checking
    if (player.x < 0) player.x = 0;
    if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

    // Enemy Processing
    spawnTimer++;
    if (spawnTimer >= SPAWN_INTERVAL) {
        spawnEnemy();
        spawnTimer = 0;
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let enemy = enemies[i];

        if (enemy.x < player.x) {
            enemy.x += ENEMY_SPEED;
        } else {
            enemy.x -= ENEMY_SPEED;
        }

        if (checkCollision(player, enemy)) {
            player.hp -= 0.5; 
            if (player.hp <= 0) {
                gameOver = true;
            }
        }
    }

    // Bullet Processing
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        let bulletRemoved = false;
        const bRect = { x: b.x - b.radius, y: b.y - b.radius, width: b.radius * 2, height: b.radius * 2 };

        for (let j = enemies.length - 1; j >= 0; j--) {
            let enemy = enemies[j];
            if (checkCollision(bRect, enemy)) {
                enemy.hp -= GLOCK_DAMAGE;
                bullets.splice(i, 1);
                bulletRemoved = true;

                if (enemy.hp <= 0) {
                    enemies.splice(j, 1);
                    score += 100;
                }
                break;
            }
        }
        if (bulletRemoved) continue;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Platforms
    ctx.fillStyle = "#555";
    for (let plat of platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
    }

    // Player
    ctx.fillStyle = "#3498db";
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Glock Weapon Pointer
    ctx.save();
    ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
    const angle = Math.atan2(mouse.y - (player.y + player.height / 2), mouse.x - (player.x + player.width / 2));
    ctx.rotate(angle);
    ctx.fillStyle = "#333";
    ctx.fillRect(5, -3, 12, 6); 
    ctx.restore();

    // Bullets
    ctx.fillStyle = "#f1c40f";
    for (let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fill();
    }

    // Enemies
    for (let enemy of enemies) {
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);

        ctx.fillStyle = "#c0392b";
        ctx.fillRect(enemy.x, enemy.y - 10, enemy.width, 4);
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(enemy.x, enemy.y - 10, enemy.width * (enemy.hp / ENEMY_MAX_HP), 4);
    }

    // HUD Text Status Updates
    ctx.fillStyle = "#fff";
    ctx.font = "18px sans-serif";
    ctx.fillText(`Score: ${score}`, 20, 30);
    ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}`, 20, 55);

    // Game Over Overlay
    if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        ctx.font = "40px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "20px sans-serif";
        ctx.fillText("Click Anywhere to Restart", canvas.width / 2, canvas.height / 2 + 20);
        ctx.textAlign = "left"; 
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
